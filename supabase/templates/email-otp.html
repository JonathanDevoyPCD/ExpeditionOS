<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ExpeditionOS sign-in code</title>
  </head>
  <body style="margin:0;background:#041421;color:#d0d6d6;font-family:Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#041421;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;border:1px solid #4c7273;border-radius:20px;background:#042630;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 24px;color:#86b9b0;font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;">ExpeditionOS</p>
                <h1 style="margin:0;color:#ffffff;font-size:28px;line-height:1.2;">Your sign-in code</h1>
                <p style="margin:16px 0 0;color:#d0d6d6;font-size:15px;line-height:1.6;">Enter this six-digit code in ExpeditionOS to continue:</p>
                <p style="margin:28px 0;padding:18px;border-radius:14px;background:#041421;color:#ffffff;font-size:34px;font-weight:700;letter-spacing:8px;text-align:center;">{{ .Token }}</p>
                <p style="margin:0;color:#86b9b0;font-size:13px;line-height:1.6;">This code can be used once. If you did not request it, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
